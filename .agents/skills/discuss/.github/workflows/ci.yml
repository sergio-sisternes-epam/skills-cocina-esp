name: Discuss CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_revision:
        description: Exact peeled release commit to validate
        required: false
        type: string

permissions:
  contents: read

env:
  APM_VERSION: "0.30.0"
  ATLAS_ID: github.com/sergio-sisternes-epam/discuss-atlas
  STORE_PATH: .atlas/github.com/sergio-sisternes-epam/discuss-atlas

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Validate reusable candidate revision
        if: inputs.candidate_revision != ''
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: |
          if [ "${#CANDIDATE_REVISION}" -ne 40 ] ||
            [[ "$CANDIDATE_REVISION" == *[!0-9a-f]* ]]; then
            echo "::error title=Invalid candidate revision::Reusable release validation requires a full lowercase commit SHA."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_revision || github.sha }}
      - name: Run release-readiness tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check release version surfaces
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
        run: python3 scripts/release_readiness.py --commit "$CANDIDATE_REVISION"
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: ${{ env.APM_VERSION }}
          setup-only: true
      - name: Audit tracked source files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if [ ! -f "$file" ]; then
              continue
            fi
            apm audit --file "$file" --no-policy
          done < <(git ls-files -z)

  pull-request-boundary:
    name: Private validation boundary
    needs: metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Record private validation requirement
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "::error title=Trusted branch required::Private dependency validation never exposes credentials to fork pull requests. Reproduce this commit on a trusted internal branch."
            exit 1
          fi
          echo "::notice title=Trusted branch private validation::Same-repository pull requests run source, store, and consumer private gates with the repository credential. Fork pull requests never receive that credential."

  source:
    name: Source and store integrity
    needs: metadata
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
       (github.ref == 'refs/heads/main' ||
        (github.event_name == 'push' && github.ref_type == 'tag')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_revision || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: ${{ env.APM_VERSION }}
          setup-only: true
      - name: Require private dependency credential
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
        run: |
          if [ -z "$APM_READ_TOKEN" ]; then
            echo "::error title=Missing APM credential::Configure APM_READ_TOKEN with Contents: read access to Atlas, OKF, and discuss-atlas. Fork changes must be reproduced on a trusted internal branch."
            exit 1
          fi
      - name: Register APM marketplace
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: apm marketplace add sergio-sisternes-epam/atlas-marketplace --name atlas
      - name: Audit committed APM state
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: |
          # APM 0.30.0 lockfiles record git coordinates for marketplace
          # plugins. `apm audit --ci` expects `_marketplace/atlas/atlas` and
          # fails ref-consistency. Content scan + drift replay still run.
          apm audit --no-policy --no-fail-fast
      - name: Restore frozen dependency graph
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: |
          set -euo pipefail
          before="$(sha256sum apm.lock.yaml | cut -d ' ' -f 1)"
          apm install --target agent-skills --no-policy
          after="$(sha256sum apm.lock.yaml | cut -d ' ' -f 1)"
          test "$before" = "$after"
      - name: Identify pinned store revision
        id: store
        run: |
          set -euo pipefail
          store_sha="$(git ls-tree HEAD -- "$STORE_PATH" | awk '{print $3}')"
          test "${#store_sha}" -eq 40
          echo "sha=$store_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned discussion store
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: sergio-sisternes-epam/discuss-atlas
          ref: ${{ steps.store.outputs.sha }}
          path: ${{ env.STORE_PATH }}
          token: ${{ secrets.APM_READ_TOKEN }}
          persist-credentials: false
      - name: Install Atlas runtime requirements
        run: python3 -m pip install -r .agents/skills/atlas/scripts/requirements-ci.txt
      - name: Compile and lint the pinned store
        id: atlas
        run: |
          set -euo pipefail
          atlas_cli=".agents/skills/atlas/scripts/atlas.py"
          root="$(python3 "$atlas_cli" resolve "$ATLAS_ID")"
          test "$root" = "$GITHUB_WORKSPACE/$STORE_PATH"
          test "$(git -C "$root" rev-parse HEAD)" = "${{ steps.store.outputs.sha }}"
          set +e
          python3 "$atlas_cli" compile --root "$root" --json > atlas-compile.json
          status=$?
          set -e
          cat atlas-compile.json
          python3 -m json.tool atlas-compile.json >/dev/null
          test "$status" -eq 0
          python3 scripts/lint.py --root "$root"
      - name: Upload source compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-atlas-compile
          path: atlas-compile.json
          if-no-files-found: warn

  consumer:
    name: Consumer install (${{ matrix.name }})
    needs: source
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
       (github.ref == 'refs/heads/main' ||
        (github.event_name == 'push' && github.ref_type == 'tag')))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-skills
            target: agent-skills
            skill_base: .agents/skills
          - name: copilot
            target: copilot
            skill_base: .agents/skills
          - name: claude
            target: claude
            skill_base: .claude/skills
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_revision || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1
        with:
          apm-version: ${{ env.APM_VERSION }}
          setup-only: true
      - name: Require private dependency credential
        env:
          APM_READ_TOKEN: ${{ secrets.APM_READ_TOKEN }}
        run: |
          if [ -z "$APM_READ_TOKEN" ]; then
            echo "::error title=Missing APM credential::Configure APM_READ_TOKEN with Contents: read access to Atlas, OKF, and discuss-atlas. Fork changes must be reproduced on a trusted internal branch."
            exit 1
          fi
      - name: Register APM marketplace
        env:
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
        run: apm marketplace add sergio-sisternes-epam/atlas-marketplace --name atlas
      - name: Install, freeze, audit, mount, compile, and lint
        env:
          ATLAS_PAT: ${{ secrets.APM_READ_TOKEN }}
          GITHUB_APM_PAT_SERGIO_SISTERNES_EPAM: ${{ secrets.APM_READ_TOKEN }}
          SKILL_BASE: ${{ matrix.skill_base }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/discuss-consumer-$TARGET"
          mkdir -p "$consumer"
          cd "$consumer"
          git init --quiet
          apm install "$GITHUB_WORKSPACE" --target "$TARGET" --no-policy
          discuss_root=""
          for candidate in "$SKILL_BASE"/*; do
            if [ -f "$candidate/SKILL.md" ] &&
              grep -Fxq "name: discuss" "$candidate/SKILL.md"; then
              discuss_root="$candidate"
              break
            fi
          done
          test -n "$discuss_root"
          test -f "$SKILL_BASE/atlas/SKILL.md"
          test -f "$SKILL_BASE/okf/SKILL.md"
          version="$(awk '$1 == "version:" { print $2; exit }' "$GITHUB_WORKSPACE/apm.yml")"
          grep -Fx "  version: \"$version\"" "$discuss_root/SKILL.md"
          before="$(sha256sum apm.lock.yaml | cut -d ' ' -f 1)"
          # APM 0.30.0 `apm install --frozen` looks for
          # `_marketplace/atlas/atlas` while the lockfile records git
          # coordinates. Replay with a normal install and require an
          # unchanged lockfile.
          apm install --target "$TARGET" --no-policy
          after="$(sha256sum apm.lock.yaml | cut -d ' ' -f 1)"
          test "$before" = "$after"
          apm audit --no-policy --no-fail-fast
          atlas_cli="$SKILL_BASE/atlas/scripts/atlas.py"
          python3 -m pip install -r "$SKILL_BASE/atlas/scripts/requirements-ci.txt"
          python3 "$atlas_cli" mount "$ATLAS_ID" --ref main
          root="$(python3 "$atlas_cli" resolve "$ATLAS_ID")"
          git -C "$root" rev-parse HEAD
          set +e
          python3 "$atlas_cli" compile --root "$root" --json \
            > "$GITHUB_WORKSPACE/atlas-compile-$TARGET.json"
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/atlas-compile-$TARGET.json"
          python3 -m json.tool "$GITHUB_WORKSPACE/atlas-compile-$TARGET.json" \
            >/dev/null
          test "$status" -eq 0
          python3 "$discuss_root/scripts/lint.py" --root "$root"
      - name: Upload consumer compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-atlas-compile-${{ matrix.name }}
          path: atlas-compile-${{ matrix.target }}.json
          if-no-files-found: warn

  readiness:
    name: Release readiness decision
    needs:
      - metadata
      - source
      - consumer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: needs.metadata.result == 'success'
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_revision || github.sha }}
      - name: Record candidate decision
        env:
          CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
          EVENT_NAME: ${{ github.event_name }}
          METADATA_RESULT: ${{ needs.metadata.result }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          set -euo pipefail
          {
            echo "candidate_revision=$CANDIDATE_REVISION"
            echo "release_metadata=$METADATA_RESULT"
            echo "source_and_store_integrity=$SOURCE_RESULT"
            echo "consumer_install=$CONSUMER_RESULT"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$METADATA_RESULT" != success ] ||
            [ "$SOURCE_RESULT" != success ] ||
            [ "$CONSUMER_RESULT" != success ]; then
            echo "release_readiness_decision=blocked" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "release_readiness_decision=pr-validated" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$REF_TYPE" = tag ]; then
            echo "release_validation_decision=ready to publish" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          main_revision="$(git rev-parse refs/remotes/origin/main)"
          echo "main_revision=$main_revision" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$REF_NAME" != main ] ||
            [ "$CANDIDATE_REVISION" != "$main_revision" ]; then
            echo "release_readiness_decision=blocked: candidate is not exact current main" |
              tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "pre_tag_decision=ready to tag" | tee -a "$GITHUB_STEP_SUMMARY"
